name: Drivers (WDK build)

# Best-effort WDK build of the kernel drivers + ELAM on a Windows runner.
# Separate from ci.yml because installing the WDK + its Visual Studio integration
# is slow; this runs only when drivers change or on manual dispatch, so routine
# pushes stay fast. Drivers can only be BUILT here — loaded and runtime-verified
# in the disposable VM (vm/run-integration-tests.ps1).

on:
  push:
    paths:
      - "drivers/**"
      - ".github/workflows/drivers.yml"
  workflow_dispatch:

concurrency:
  group: drivers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drivers-windows:
    # Pinned to windows-2022 (Visual Studio 2022 / v17). windows-latest ships
    # VS 18, but the WDK 11 VSIX targets VS 2022, so on newer images the driver
    # toolset (WindowsKernelModeDriver10.0) fails to register and MSBuild falls
    # back to a user-mode compile that cannot find ntddk.h.
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Windows Driver Kit + VS extension
        shell: pwsh
        run: |
          choco install windowsdriverkit11 --no-progress -y
          # Install the WDK VS extension (VSIX) into VS 2022 so msbuild resolves
          # the kernel-mode driver toolset + WDK include/lib paths.
          $vsix = Get-ChildItem "C:\Program Files (x86)\Windows Kits" -Recurse -Filter "WDK.vsix" -ErrorAction SilentlyContinue | Select-Object -First 1
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          $installer = Join-Path $vsPath "Common7\IDE\VSIXInstaller.exe"
          # On windows-2022 the choco WDK installer integrates with VS 2022 on its
          # own, so this explicit VSIX install is only a fallback. Bound it hard
          # (3 min) because VSIXInstaller can hang headless; a hang here must not
          # stall the job.
          if ($vsix -and (Test-Path $installer)) {
            Write-Host "Installing WDK VSIX: $($vsix.FullName) into $vsPath"
            $p = Start-Process -FilePath $installer -ArgumentList "/quiet","/norestart",$vsix.FullName -PassThru
            if (-not $p.WaitForExit(180000)) {
              Write-Host "VSIXInstaller still running after 3 min; killing (choco may have already integrated)."
              try { $p.Kill() } catch {}
            } else {
              Write-Host "VSIXInstaller exit code: $($p.ExitCode)"  # 0 ok, 1001 = already installed
            }
          } else {
            Write-Host "WDK VSIX not found via search; relying on choco's VS integration."
          }
      - name: Verify the WDK driver toolset is present
        shell: pwsh
        run: |
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          $targets = Join-Path $vsPath "MSBuild\Microsoft\VC\v170\Platforms\x64\PlatformToolsets\WindowsKernelModeDriver10.0"
          Write-Host "Driver toolset dir: $targets"
          if (Test-Path $targets) { Write-Host "OK: kernel-mode driver toolset present." }
          else { Write-Host "WARNING: kernel-mode driver toolset NOT found; driver build will fail." }
          Get-ChildItem "C:\Program Files*\Windows Kits\10\Include" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
      # This job VERIFIES THE BUILD: it proves the driver C/C++ compiles and
      # links clean as a real kernel-mode binary (toolset
      # WindowsKernelModeDriver10.0, /kernel, KMDF). The deployment/packaging
      # steps are deliberately NOT run here:
      #   * Signing  -> /p:SignMode=Off. CI has no code-signing certificate;
      #     test-signing + loading happen in the disposable VM.
      #   * INF verification -> neutralised CI-only via ForceImportAfterCppTargets
      #     (drivers/ci-build-overrides.targets), because this runner image's WDK
      #     10.0.26100 ships a broken InfVerif tool ("Unable to load DLL
      #     'x86\InfVerif.dll'"). Real INF verification runs in the VM.
      # The VM runbook (vm/VERIFICATION-RUNBOOK.md) does the full stamp/verify/
      # sign/load/runtime pass; nothing here weakens that.
      #
      # All five kernel drivers must build clean (required):
      #   * fsfilter  — file-system minifilter (execute gate)
      #   * shadowfs  — shadow-COW minifilter (rollback gate)
      #   * elam      — ELAM boot driver + BYOVD blocklist
      #   * procmon   — process/thread/image/registry callbacks + object-callback
      #                 self-protection (sensor via control-device IOCTL comms)
      #   * netfilter — WFP ALE-connect callout (sensor via control-device IOCTL comms)
      # The minifilters use the FltMgr comms (comms.c); procmon/netfilter use the
      # control-device IOCTL comms (sensor_comms.c). Any failure fails the job.
      - name: Build kernel drivers (fsfilter, shadowfs, elam, procmon, netfilter)
        shell: pwsh
        run: |
          $overrides = (Resolve-Path "drivers/ci-build-overrides.targets").Path
          $projects = @(
            "drivers/fsfilter/fsfilter.vcxproj",
            "drivers/shadowfs/shadowfs.vcxproj",
            "drivers/elam/elam.vcxproj",
            "drivers/procmon/procmon.vcxproj",
            "drivers/netfilter/netfilter.vcxproj"
          )
          $failed = $false
          foreach ($p in $projects) {
            Write-Host "::group::msbuild $p"
            msbuild $p /p:Configuration=Release /p:Platform=x64 /m `
              /p:SignMode=Off /p:ForceImportAfterCppTargets="$overrides"
            if ($LASTEXITCODE -ne 0) { $failed = $true; Write-Host "FAILED: $p" }
            Write-Host "::endgroup::"
          }
          if ($failed) { exit 1 }
