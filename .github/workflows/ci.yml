name: Sentinel CI

# Fast, reliable build verification on every push:
#   - engine-linux   : portable C++17 engine + full test suite (the 71-test guard)
#   - engine-windows : the same engine built with MSVC (/W4 /WX) + tests
#   - ui-windows     : the WPF dashboard + tray built with .NET 8
#
# The kernel DRIVERS build in a separate workflow (drivers.yml) because the WDK
# toolchain install is slow; it runs only on driver changes or manual dispatch.
# Drivers can only be BUILT in CI — loaded and runtime-verified in the VM
# (vm/run-integration-tests.ps1, vm/VERIFICATION-RUNBOOK.md).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake g++
      - name: Configure (warnings as errors)
        run: cmake -S engine -B out -DSENTINEL_BUILD_TESTS=ON -DSENTINEL_BUILD_TOOLS=ON -DSENTINEL_WARNINGS_AS_ERRORS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build out -j
      - name: Test
        run: ctest --test-dir out --output-on-failure

  engine-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (MSVC, /W4 /WX)
        run: cmake -S engine -B out -DSENTINEL_BUILD_TESTS=ON -DSENTINEL_BUILD_TOOLS=ON -DSENTINEL_WARNINGS_AS_ERRORS=ON
      - name: Build Release
        run: cmake --build out --config Release
      - name: Test
        run: ctest --test-dir out -C Release --output-on-failure

  ui-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build dashboard
        run: dotnet build ui/Sentinel.UI/Sentinel.UI.csproj -c Release
      - name: Build tray
        run: dotnet build ui/Sentinel.Tray/Sentinel.Tray.csproj -c Release
